<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a78d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Fatties</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1>Fatties</h1>
    <div class="who" id="who" role="radiogroup" aria-label="Who is logging"></div>
  </header>

  <nav class="tabs" role="tablist" hidden>
    <button role="tab" data-view="log">Log</button>
    <button role="tab" data-view="day">Day</button>
    <button role="tab" data-view="week">Week</button>
    <button role="tab" data-view="targets">Plan</button>
  </nav>

  <main>
    <section id="view-login" class="view" hidden>
      <form id="login-form" class="card login">
        <h2>Log in</h2>
        <label>Name
          <input id="login-name" name="username" autocomplete="username" autocapitalize="words" required>
        </label>
        <label>Password
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary">Log in</button>
        <p class="status" id="login-status" role="status"></p>
      </form>
    </section>

    <section id="view-log" class="view" hidden>
      <form id="photo-form" class="card">
        <label class="photo-pick" id="photo-pick">
          <input type="file" id="photo" accept="image/*" capture="environment" hidden>
          <img id="preview" alt="" hidden>
          <span id="photo-hint">Take or choose a photo of the meal</span>
        </label>
        <div class="row">
          <label>Meal
            <select id="meal-type"></select>
          </label>
          <label class="grow">Note (optional)
            <input id="note" maxlength="500" placeholder="ate half, less rice, kopi siew dai">
          </label>
        </div>
        <button type="submit" class="primary" id="analyze" disabled>Estimate</button>
        <p class="status" id="analyze-status" role="status"></p>
      </form>
      <div id="estimate"></div>
    </section>

    <section id="view-day" class="view" hidden>
      <div class="pager">
        <button data-step="-1" aria-label="Previous day">‹</button>
        <h2 id="day-label"></h2>
        <button data-step="1" aria-label="Next day">›</button>
      </div>
      <div class="pair" id="day-people"></div>
    </section>

    <section id="view-week" class="view" hidden>
      <div class="pager">
        <button data-step="-7" aria-label="Previous week">‹</button>
        <h2 id="week-label"></h2>
        <button data-step="7" aria-label="Next week">›</button>
      </div>
      <div class="pair" id="week-people"></div>
      <div class="card" id="week-compare"></div>
    </section>

    <section id="view-targets" class="view" hidden>
      <div class="pair" id="target-people"></div>
      <p class="signed-in"><span id="signed-in-as"></span> <button class="ghost" id="logout">Log out</button></p>
    </section>
  </main>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
